<!DOCTYPE html>

<head>

<title>Periodic Energy Table | Dr. Khalid Abdelfattah M. Osman</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f9; margin: 0; padding: 12px; color: #1a202c; }
  .header { background: #fff; padding: 14px; border-radius: 10px; text-align: center; border-bottom: 3px solid #1a365d; box-shadow: 0 2px 6px rgba(0,0,0,0.06); margin-bottom: 12px; }
  .header h1 { margin: 0; font-size: 1.35rem; color: #102a43; }
  .header p { margin: 4px 0 0; font-size: 0.85rem; color: #486581; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; background: #fff; padding: 10px; border-radius: 8px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
  select, input { padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e0; font-size: 0.85rem; font-weight: 600; }
  .info-bar { background: #fffbeb; border: 1px solid #f59e0b; color: #78350f; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 0.88rem; text-align: center; }

  table { border-collapse: collapse; margin: 0 auto; min-width: 1120px; text-align: center; font-size: 11px; }
  th, td { border: 1px solid #2d3748; padding: 3px 2px; min-width: 38px; height: 34px; }
  .shell { background: #d9e2ec; font-weight: bold; min-width: 62px; }
  .iupac { background: #f0f4f8; font-weight: bold; font-size: 10px; height: 22px; }
  .grp { background: #e6fffa; font-weight: bold; font-size: 10px; height: 22px; }
  .s-blk { background: #70ad47; }
  .p-blk { background: #8ea9db; }
  .d-blk { background: #ffff00; }
  .f-blk { background: #f4b084; }
  .g-blk { background: #d9d9d9; }
  .el-137 { background: #e53e3e !important; color: #fff; font-weight: bold; }
  .badge { display: block; font-size: 8.5px; background: rgba(255,255,255,0.75); color: #000; border-radius: 2px; margin-top: 1px; }
  .el-137 .badge { background: rgba(0,0,0,0.35); color: #fff; }
  .dim { opacity: 0.2; }
  .hi { outline: 3px solid #102a43; font-weight: bold; transform: scale(1.05); }
  .spacer td { border: none; height: 8px; }
  .no-b { border: none !important; background: transparent !important; }
</style>
</head>
<body>

<div class="header">
  <h1>⚛️ Periodic Energy Table of Chemical Elements (جدول الطاقة الدوري)</h1>
  <p><strong>Dr. Khalid Abdelfattah M. Osman</strong> | Merowe University of Technology, Sudan — Madelung (n + ℓ) Quantum Matrix</p>
</div>

<div class="toolbar">
  <select id="modeSel" onchange="draw()">
    <option value="both">العناصر + قيم الطاقة (Elements + E)</option>
    <option value="energy">مصفوفة الطاقة فقط (FIG. 1: n + ℓ)</option>
  </select>

  <select id="energySel" onchange="draw()">
    <option value="all">⚡ تظليل مستوى الطاقة (الكل)</option>
    <option value="1">E = 1 (1s)</option>
    <option value="2">E = 2 (2s)</option>
    <option value="3">E = 3 (2p, 3s)</option>
    <option value="4">E = 4 (3p, 4s)</option>
    <option value="5">E = 5 (3d, 4p, 5s)</option>
    <option value="6">E = 6 (4d, 5p, 6s)</option>
    <option value="7">E = 7 (4f, 5d, 6p, 7s)</option>
    <option value="8">E = 8 (5f, 6d, 7p, 8s)</option>
    <option value="9">E = 9 (5g, 6f, 7d, 8p)</option>
    <option value="10">E = 10 (7f)</option>
  </select>

  <input type="text" id="searchBox" placeholder="🔍 ابحث برمز أو عدد ذري (مثلاً: 26 أو Fe)" oninput="draw()">
</div>

<div class="info-bar" id="infoBar">
  اختر مستوى طاقة أو اكتب العدد الذري (1 إلى 137) لعرض التوزيع الإلكتروني وتظليل المدارات المتساوية في الطاقة.
</div>

<div class="table-box">
  <table id="tbl"></table>
</div>

<script>
const orbNames = ['s','p1','p2','p3','d1','d2','d3','d4','d5','f1','f2','f3','f4','f5','f6','f7','g1','g2','g3','g4','g5','g6','g7','g8','g9'];
const orbL =;
const orbCss = ['s-blk','p-blk','p-blk','p-blk','d-blk','d-blk','d-blk','d-blk','d-blk','f-blk','f-blk','f-blk','f-blk','f-blk','f-blk','f-blk','g-blk','g-blk','g-blk','g-blk','g-blk','g-blk','g-blk','g-blk','g-blk'];

const topRows = [
  ['8', [['119',8],['',9],['',9],['',9]]],
  ['7', [['87 Fr',7],['113 Nh',8],['114 Fl',8],['115 Mc',8],['',9],['',9],['',9],['',8],['',9],['',10],['',10],['',10],['',10],['',10],['',10],['',10]]],
  ['6', [['55 Cs',6],['81 Tl',7],['82 Pb',7],['83 Bi',7],['103 Lr',6],['104 Rf',8],['105 Db',8],['106 Sg',8],['107 Bh',6],['',9],['',9],['',9],['',9],['',9],['',9],['',9]]],
  ['5', [['37 Rb',5],['49 In',5],['50 Sn',6],['51 Sb',6],['71 Lu',7],['72 Hf',7],['73 Ta',7],['74 W',7],['75 Re',7],['89 Ac',8],['90 Th',8],['91 Pa',8],['92 U',8],['93 Np',8],['94 Pu',8],['95 Am',8],['121',9],['122',9],['123',9],['124',9],['125',9],['126',9],['127',9],['128',9],['129',9]]],
  ['4', [['19 K',4],['31 Ga',5],['32 Ge',5],['33 As',5],['39 Y',6],['40 Zr',6],['41 Nb',6],['42 Mo',6],['43 Tc',6],['57 La',7],['58 Ce',7],['59 Pr',7],['60 Nd',7],['61 Pm',7],['62 Sm',7],['63 Eu',7]]],
  ['3', [['11 Na',3],['13 Al',4],['14 Si',4],['15 P',4],['21 Sc',5],['22 Ti',5],['23 V',5],['24 Cr',5],['25 Mn',5]]],
  ['2', [['3 Li',2],['5 B',3],['6 C',3],['7 N',3]]],
  ['1', [['1 H',1]]]
];

const botRows = [
  ["1'", [['2 He',1]]],
  ["2'", [['4 Be',2],['8 O',3],['9 F',3],['10 Ne',3]]],
  ["3'", [['12 Mg',3],['16 S',4],['17 Cl',4],['18 Ar',4],['26 Fe',5],['27 Co',5],['28 Ni',5],['29 Cu',5],['30 Zn',5]]],
  ["4'", [['20 Ca',4],['34 Se',5],['35 Br',5],['36 Kr',5],['44 Ru',6],['45 Rh',6],['46 Pd',8],['47 Ag',6],['48 Cd',6],['64 Gd',7],['65 Tb',7],['66 Dy',7],['67 Ho',7],['68 Er',7],['69 Tm',7],['70 Yb',7]]],
  ["5'", [['38 Sr',5],['52 Te',6],['53 I',6],['54 Xe',6],['76 Os',7],['77 Ir',7],['78 Pt',7],['79 Au',7],['80 Hg',7],['96 Cm',8],['97 Bk',8],['98 Cf',8],['99 Es',8],['100 Fm',8],['101 Md',8],['102 No',8],['130',9],['131',9],['132',9],['133',9],['134',9],['135',9],['136',9],['137',9]]],
  ["6'", [['56 Ba',6],['84 Po',7],['85 At',7],['86 Rn',7],['108 Hs',8],['109 Mt',8],['110 Ds',8],['111 Rg',8],['112 Cn',8],['',9],['',9],['',9],['',9],['',9],['',9],['',9]]],
  ["7'", [['88 Ra',7],['116 Lv',8],['117 Ts',8],['118 Og',8],['',9],['',9],['',9],['',5],['',5],['',10],['',10],['',10],['',10],['',10],['',10],['',10]]],
  ["8'", [['120',8],['',9],['',9],['',9]]]
];

function getConfig(z) {
  const subs = [['1s',2],['2s',2],['2p',6],['3s',2],['3p',6],['4s',2],['3d',10],['4p',6],['5s',2],['4d',10],['5p',6],['6s',2],['4f',14],['5d',10],['6p',6],['7s',2],['5f',14],['6d',10],['7p',6],['8s',2],['5g',18]];
  let rem = z, res = [];
  for (let i = 0; i < subs.length; i++) {
    if (rem <= 0) break;
    let f = Math.min(rem, subs.at(i).at(1));
    res.push(`${subs.at(i).at(0)}<sup>${f}</sup>`);
    rem -= f;
  }
  return res.join(' ');
}

function draw() {
  const mode = document.getElementById('modeSel').value;
  const eFilter = document.getElementById('energySel').value;
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const info = document.getElementById('infoBar');

  if (q && !isNaN(q) && Number(q) >= 1 && Number(q) <= 137) {
    info.innerHTML = `🧬 <strong>التوزيع الإلكتروني للعدد الذري (Z = ${q}):</strong> ${getConfig(Number(q))}`;
  } else if (eFilter !== 'all') {
    info.innerHTML = `⚡ <strong>تظليل المدارات ذات الطاقة المتساوية (n + ℓ = ${eFilter})</strong> عبر الفئات المختلفة.`;
  } else {
    info.innerHTML = `اختر مستوى طاقة أو اكتب العدد الذري (1 إلى 137) لعرض التوزيع الإلكتروني وتظليل المدارات المتساوية في الطاقة.`;
  }

  let h = '';
  h += '<tr><th class="shell">Azimuthal (ℓ)</th>' + orbL.map(l => `<th class="iupac">ℓ=${l}</th>`).join('') + '</tr>';
  h += '<tr><th class="shell">Shell/Orbital</th>' + orbNames.map(n => `<th class="shell">${n}</th>`).join('') + '</tr>';
  h += '<tr><td class="no-b"></td><td colspan="16" class="iupac">Groups Numbers according to IUPAC version 4 May 2022</td><td colspan="9" class="no-b"></td></tr>';
  h += '<tr><td class="no-b"></td>' + ['1','13','14','15','3','4','5','6','7','19','20','21','22','23','24','25'].map(g => `<td class="grp">${g}</td>`).join('') + '<td colspan="9" class="no-b"></td></tr>';

  const makeRows = (rows) => rows.map(rowItem => {
    let sh = rowItem.at(0);
    let cells = rowItem.at(1);
    let r = `<tr><td class="shell">n=${sh}</td>`;
    for (let i = 0; i < 25; i++) {
      if (i < cells.length) {
        let sym = cells.at(i).at(0);
        let e = cells.at(i).at(1);
        let cls = orbCss.at(i);
        if (sym === '137' && mode === 'both') cls += ' el-137';
        if (q) {
          cls += (sym && sym.toLowerCase().includes(q)) ? ' hi' : ' dim';
        } else if (eFilter !== 'all') {
          cls += (String(e) === eFilter) ? ' hi' : ' dim';
        }
        let body = mode === 'energy' ? `<strong>${e}</strong>` : (sym ? `<strong>${sym}</strong><span class="badge">E=${e}</span>` : `<span class="badge">E=${e}</span>`);
        r += `<td class="${cls}">${body}</td>`;
      } else {
        r += '<td class="no-b"></td>';
      }
    }
    return r + '</tr>';
  }).join('');

  h += makeRows(topRows);
  h += '<tr class="spacer"><td colspan="26"></td></tr>';
  h += '<tr><td class="no-b"></td>' + ['1','13','14','15','3','4','5','6','7'].map(g => `<td class="grp">${g}</td>`).join('') + '<td colspan="7" class="iupac">Lanthanoids & Actinoids</td><td colspan="9" class="no-b"></td></tr>';
  h += '<tr><td class="no-b"></td>' + ['2','16','17','18','8','9','10','11','12'].map(g => `<td class="grp">${g}</td>`).join('') + '<td colspan="7" class="iupac">Lanthanoids & Actinoids</td><td colspan="9" class="no-b"></td></tr>';
  h += '<tr class="spacer"><td colspan="26"></td></tr>';
  h += makeRows(botRows);
  h += '<tr class="spacer"><td colspan="26"></td></tr>';
