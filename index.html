<script>
const orbNames = new Array('s','p1','p2','p3','d1','d2','d3','d4','d5','f1','f2','f3','f4','f5','f6','f7','g1','g2','g3','g4','g5','g6','g7','g8','g9');

function getConfig(z) {
  const subs = new Array(
    cell('1s',2),cell('2s',2),cell('2p',6),cell('3s',2),cell('3p',6),
    cell('4s',2),cell('3d',10),cell('4p',6),cell('5s',2),cell('4d',10),
    cell('5p',6),cell('6s',2),cell('4f',14),cell('5d',10),cell('6p',6),
    cell('7s',2),cell('5f',14),cell('6d',10),cell('7p',6),cell('8s',2),
    cell('5g',18)
  );
  let rem = z, res = new Array();
  for (let i = 0; i < subs.length; i++) {
    if (rem <= 0) break;
    let f = Math.min(rem, subs.at(i).at(1));
    res.push(`${subs.at(i).at(0)}<sup>${f}</sup>`);
    rem -= f;
  }
  return res.join(' ');
}

function draw() {
  const mode = document.getElementById('modeSel').value;
  const eFilter = document.getElementById('energySel').value;
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const info = document.getElementById('infoBar');

  if (q && !isNaN(q) && Number(q) >= 1 && Number(q) <= 137) {
    info.innerHTML = `🧬 <strong>التوزيع الإلكتروني للعدد الذري (Z = ${q}):</strong> ${getConfig(Number(q))}`;
  } else if (eFilter !== 'all') {
    info.innerHTML = `⚡ <strong>تظليل المدارات ذات الطاقة المتساوية (n + ℓ = ${eFilter})</strong> عبر الفئات المختلفة.`;
  } else {
    info.innerHTML = `اختر مستوى طاقة أو اكتب العدد الذري (1 إلى 137) لعرض التوزيع الإلكتروني وتظليل المدارات المتساوية في الطاقة.`;
  }

  let h = '';
  h += '<tr><th class="shell">Azimuthal (ℓ)</th>' + orbL.map(l => `<th class="iupac">ℓ=${l}</th>`).join('') + '</tr>';
  h += '<tr><th class="shell">Shell/Orbital</th>' + orbNames.map(n => `<th class="shell">${n}</th>`).join('') + '</tr>';
  h += '<tr><td class="no-b"></td><td colspan="16" class="iupac">Groups Numbers according to IUPAC version 4 May 2022</td><td colspan="9" class="no-b"></td></tr>';
  h += '<tr><td class="no-b"></td>' + new Array('1','13','14','15','3','4','5','6','7','19','20','21','22','23','24','25').map(g => `<td class="grp">${g}</td>`).join('') + '<td colspan="9" class="no-b"></td></tr>';

  const makeRows = (rows) => rows.map(rowItem => {
    let sh = rowItem.at(0);
    let cells = rowItem.at(1);
    let r = `<tr><td class="shell">n=${sh}</td>`;
    for (let i = 0; i < 25; i++) {
      if (i < cells.length) {
        let sym = cells.at(i).at(0);
        let e = cells.at(i).at(1);
        let cls = orbCss.at(i);
        if (sym === '137' && mode === 'both') cls += ' el-137';
